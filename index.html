<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="검단중앙교회 소년부 사진 앨범">
    <meta name="theme-color" content="#ffffff">
    <meta property="og:type" content="website">
    <meta property="og:title" content="검단중앙교회 소년부 사진 앨범">
    <meta property="og:description" content="소년부 친구들이 믿음 안에서 잘 자라도록 기도해주세요">
    <meta property="og:image" content="https://robinphoto.github.io/data/og/juniors.png">
    <meta property="og:url" content="https://robinphoto.github.io/juniors/">
    <title>검단중앙교회 소년부 사진 앨범</title>
    <link rel="icon" href="favicon.ico?v=2" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <main class="page-shell">
      <header class="profile">
        <div class="profile__aside">
          <img class="profile__avatar" data-asset="profile/juniors.png" alt="검단중앙교회 소년부 프로필 이미지">
        </div>
        <div class="profile__content">
          <div class="profile__title">
            <p class="eyebrow">CHURCH PHOTO ARCHIVE</p>
            <h1>검단중앙교회 소년부 사진 앨범</h1>
          </div>
          <p class="profile__description">소년부의 예배와 행사, 소중한 은혜의 순간들을 기록합니다.<br>앨범을 선택하면 구글포토에서 전체 사진을 볼 수 있어요.</p>
          <div class="profile__stats" aria-label="전체 앨범 통계">
            <span><img data-icon="folder.svg" alt=""><span id="total-albums">총 앨범 수 계산 중</span></span>
            <span><img data-icon="image.svg" alt=""><span id="total-photos">총 사진 수 계산 중</span></span>
          </div>
        </div>
      </header>

      <section class="filters" aria-label="앨범 검색 조건">
        <div class="primary-filters">
          <div class="filter-group">
            <h2>분류</h2>
            <div class="filter-buttons" id="event-filters"></div>
          </div>
        </div>
        <details class="advanced-search">
          <summary>검색 옵션 <span>연도, 월과 키워드</span><img class="chevron chevron--down" data-icon="chevron-down.svg" alt=""><img class="chevron chevron--up" data-icon="chevron-up.svg" alt=""></summary>
          <div class="advanced-search__body">
            <div class="filter-group"><h2>연도</h2><div class="filter-buttons" id="year-filters"></div></div>
            <div class="filter-group"><h2>월</h2><div class="filter-buttons" id="month-filters"></div></div>
            <label class="keyword-search"><span>키워드</span><span class="keyword-search__field"><input id="keyword-input" type="search" placeholder="앨범명 검색" autocomplete="off"><img data-icon="search.svg" alt=""></span></label>
          </div>
        </details>
        <div class="results-toolbar">
          <p id="result-summary" aria-live="polite">앨범을 불러오는 중입니다.</p>
          <div class="results-controls">
            <button class="sort-control open-mode-control" id="open-mode-toggle" type="button" aria-label="현재 새창으로 열기, 팝업창으로 변경">
              <img data-icon="external-link.svg" alt="">
              <span>새창</span>
            </button>
            <button class="sort-control" id="sort-toggle" type="button" aria-label="현재 최근순, 오래된순으로 변경">
              <img data-icon="clock-arrow-down.svg" alt="">
              <span>최근순</span>
            </button>
          </div>
        </div>
      </section>
      <section class="album-grid" id="album-grid" aria-label="앨범 목록"></section>
      <p class="empty-state" id="empty-state" hidden>조건에 맞는 앨범이 없습니다.</p>
      <p class="error-state" id="error-state" hidden>앨범 데이터를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</p>
    </main>
    <template id="album-card-template">
      <article class="album-card"><a class="album-card__link" target="_blank" rel="noopener noreferrer"><div class="album-card__image-wrap"><img class="album-card__image" loading="lazy" alt=""><span class="album-card__year"></span><span class="album-card__photo-count"></span></div><h2 class="album-card__title"></h2><p class="album-card__meta"></p></a></article>
    </template>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
